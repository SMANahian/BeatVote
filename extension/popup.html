<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --bg: #0b1020;
        --card: rgba(255, 255, 255, 0.08);
        --stroke: rgba(255, 255, 255, 0.14);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
        --brand: #7c3aed;
        --ok: #22c55e;
      }
      body {
        margin: 0;
        background: radial-gradient(420px 320px at 20% -10%, #3b0764 0%, transparent 60%),
          radial-gradient(420px 320px at 90% 0%, #0ea5e9 0%, transparent 55%),
          linear-gradient(180deg, #0b1020 0%, #101a34 100%);
        color: var(--text);
        font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        width: 340px;
      }
      .wrap {
        padding: 14px;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      .mark {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--brand) 0%, #06b6d4 100%);
        box-shadow: 0 10px 30px rgba(124, 58, 237, 0.35);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--stroke);
        border-radius: 14px;
        padding: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      label {
        display: block;
        font-weight: 650;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 9px 10px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(10, 16, 32, 0.35);
        color: var(--text);
        outline: none;
      }
      input:focus {
        border-color: rgba(124, 58, 237, 0.6);
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.25);
      }
      .btn {
        padding: 9px 10px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.10);
        color: var(--text);
        cursor: pointer;
        transition: transform 120ms ease, background 120ms ease;
        user-select: none;
      }
      .btn:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.14);
      }
      .btnPrimary {
        background: linear-gradient(135deg, var(--brand) 0%, #06b6d4 100%);
      }
      .status {
        margin-top: 10px;
        color: var(--muted);
        min-height: 18px;
      }
      .status.ok {
        color: rgba(34, 197, 94, 0.95);
      }
      .hint {
        color: var(--muted);
        margin-top: 8px;
        font-size: 12px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">
        <div class="mark"></div>
        <div>BeatVote Player</div>
      </div>

      <div class="card">
        <div style="margin-bottom: 10px">
          <label for="server">Server URL</label>
          <input id="server" type="text" placeholder="http://127.0.0.1:5000" class="mono" />
        </div>
        <div style="margin-bottom: 10px">
          <label for="room">Room ID</label>
          <input id="room" type="text" placeholder="e.g. 3f0d..." class="mono" />
        </div>
        <div style="margin-bottom: 10px">
          <label for="token">Host Token</label>
          <input id="token" type="text" placeholder="Copy from Host view" class="mono" />
        </div>
        <div class="row" style="justify-content: space-between">
          <button id="openHost" class="btn">Open host tab</button>
          <button id="save" class="btn btnPrimary">Save</button>
        </div>
        <div id="status" class="status"></div>
        <div class="hint">
          Tip: open <span class="mono">/host</span> and copy the token from the Host view.
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
